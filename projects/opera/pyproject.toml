[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opera"
version = "0.0.1"
description = "OPERA: Online Data Pruning for Efficient Retrieval Model Adaptation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Haoyang Fang" }]
dependencies = [
    "torch>=2.6.0",
    "transformers>=4.51.0",
    "datasets",
    "accelerate>=0.30.0",
    "sentence_transformers",
    "ir_datasets==0.5.6",
    "faiss-gpu",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.3",
    "omegaconf==2.3.0",
    "wandb",
    "peft>=0.12.0",
    "numpy<2",
]

[tool.setuptools.packages.find]
include = ["opera*"]
